# Postgres local para probar con una copia (anonimizada) de producción.
# Uso: ver README.md
name: coworking-local
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: coworking
      POSTGRES_PASSWORD: coworking
      POSTGRES_DB: coworking
    ports:
      - "5434:5432"   # 5434 para no chocar con otros Postgres locales (5432, 5433)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dump:/dump:ro
      - ./anonymize.sql:/anonymize.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworking -d coworking"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
